---
replicas: 1

# -- different name for the helm release
nameOverride: ""

deployment:
  type: Deployment
  hostNetwork: false
  # When hostNetwork is set to true, the dnsPolicy must be set to ClusterFirstWithHostNet so Cluster internal services are still resolvable
  dnsPolicy: "ClusterFirst"

service:
  # -- The type of service to deploy for routing Coturn traffic.
  #   ClusterIP: Recommended for DaemonSet configurations. This will create a
  #              standard Kubernetes service for Coturn within the cluster.
  #              No external networking will be configured as the DaemonSet
  #              will handle binding to each Node's host networking
  #
  #   NodePort:  Recommended for Deployment configurations. This will open
  #              TURN ports on every node and route traffic on these ports to
  #              the Coturn pods. You will need to make sure your cloud
  #              provider supports the cluster config setting,
  #              apiserver.service-node-port-range, as this range must contain
  #              the ports defined above for the service to be created.
  #
  #   LoadBalancer: This was what was originally set for this chart in the
  #                 upstream of this fork, but with no details
  type: ClusterIP
  # -- determines how external traffic is routed to services. Options:
  #   Cluster: mask client source IP
  #   Local: preserve client source IP (requires service type of NodePort or LoadBalancer)
  externalTrafficPolicy: "Cluster"

image:
  # -- container registry and repo for coturn docker image
  repository: "coturn/coturn"
  # -- docker tag for coturn server
  tag: ""
  # -- image pull policy, set to Always if using image.tag: latest
  pullPolicy: IfNotPresent

# -- ref: kubernetes.io/docs/concepts/configuration/manage-resources-containers
resources: {}

# -- Coturn specific labels
labels:
  component: coturn

certificate:
  # -- Enables auto issuing certificates over cert-manager certificates
  # https://cert-manager.io/docs/concepts/certificate/
  enabled: false
  # -- name of secret to create for ssl cert
  secret: "turn-tls"
  # -- name of cert-manager issuer to use for cert generation.
  # change to production issuer when you're stable
  issuerName: "letsencrypt-staging"

externalDatabase:
  # -- enables the use of postgresql instead of the default sqlite
  # to use the bundled subchart, enable this, and postgresql.enable
  enabled: false
  # -- Currently postgresql and mysql are supported.
  type: "postgresql"
  # -- required if externalDatabase.enabled: true and postgresql.enabled: false
  hostname: ""
  # -- username for database, ignored if existingSecret is passed in
  username: ""
  # -- password for database, ignored if existingSecret is passed in
  password: ""
  # -- database to create, ignored if existingSecret is passed in
  database: ""
  # -- name of existing Secret to use for postgresql credentials
  existingSecret: ""
  # Names of the keys in existing secret to use for PostgreSQL credentials
  secretKeys:
    # -- key in existing Secret to use for the db user
    username: ""
    # -- key in existing Secret to use for db user's password
    password: ""
    # -- key in existing Secret to use for the database name
    database: ""
    # -- key in existing Secret to use for the db's hostname
    hostname: ""
  # Custom image for database readiness check
  image:
    # -- container registry and repo for database readiness docker image
    repository: ""
    # -- container tag for coturn database readiness docker image
    tag: ""

# PostgreSQL chart configuration
# see: https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  # -- enables bitnami postgresql subchart, you can disable to use external db
  enabled: false
  global:
    postgresql:
      # global.postgresql.auth overrides postgresql.auth
      auth:
        # -- username for database, ignored if existingSecret is passed in
        username: "coturn"
        # -- password for db, autogenerated if empty & existingSecret empty
        password: ""
        # -- database to create, ignored if existingSecret is passed in
        database: "coturn"
        # -- name of existing Secret to use for postgresql credentials
        existingSecret: ""
        # Names of the keys in existing secret to use for PostgreSQL credentials
        # all of these are ignored if existingSecret is empty
        secretKeys:
          # -- key in existingSecret for database to create
          hostname: "hostname"
          # -- key in existingSecret for database to create
          database: "database"
          # -- key in exsiting Secret to use for the coturn user
          username: "username"
          # -- key in existing Secret to use for postgres admin user's password
          adminPasswordKey: "postgresPassword"
          # -- key in existing Secret to use for coturn user's password
          userPasswordKey: "password"
  primary:
    initdb:
      # -- ConfigMap with scripts to be run at first boot
      scriptsConfigMap: ""

# MySQL chart configuration
mysql:
  # -- enable deploying the bundled pxc-db sub-chart. Requires the Percona PXC Operator
  # learn more here: https://github.com/percona/percona-helm-charts/tree/main/charts/pxc-db
  enabled: false
  finalizers:
    ## Set this if you want to delete proxysql persistent volumes on cluster deletion
    # - percona.com/delete-proxysql-pvc
    ## Set this if you want to delete database persistent volumes on cluster deletion
    # - percona.com/delete-pxc-pvc
    ## Set this if you want to delete cert manager certificates on cluster deletion
    # - percona.com/delete-ssl
    - percona.com/delete-pxc-pods-in-order

  nameOverride: "coturn-mysql"
  fullnameOverride: "coturn-mysql"

  crVersion: 1.20.0

  enableVolumeExpansion: false

  pause: false
  unsafeFlags:
    pxcSize: true
    # tls: false
    # backupIfUnhealthy: false

  # -- can also be: RollingUpdate
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled
    schedule: "0 4 * * *"

  enableCRValidationWebhook: false

  tls:
    # -- enable TLS, requires certmanager
    enabled: true
    certValidityDuration: 2160h
    caValidityDuration: 26280h
    # -- be sure to update these to your namespace
    SANs:
      - coturn-mysql-pxc-0.coturn.svc.cluster.local
      - coturn-mysql-pxc-1.coturn.svc.cluster.local
    issuerConf:
      # -- be sure to update this to your certmanager ClusterIssuer
      name: mysql-selfsigned-issuer
      kind: ClusterIssuer
      group: cert-manager.io

  pxc:
    size: 2
    autoRecovery: true
    readinessDelaySec: 15
    livenessDelaySec: 200
    ## Uncomment to pass in a mysql config file
    configuration: |
      [mysqld]
      pxc_strict_mode=PERMISSIVE
    # envVarsSecret: my-env-var-secrets
    resources:
      requests:
        memory: 1G
        cpu: 600m
      limits: {}
    affinity:
      # --  update this to something else if you're not running this on a single node
      antiAffinityTopologyKey: "none"

    gracePeriod: 600

    podDisruptionBudget:
      # only one of maxUnavailable or minAvaliable can be set
      maxUnavailable: 1
      # minAvailable: 0

    persistence:
      enabled: true
      # -- percona data Persistent Volume Storage Class
      storageClass: ""
      accessMode: ReadWriteOnce
      # dataSource:
      #   name: new-snapshot-test
      #   kind: VolumeSnapshot
      #   apiGroup: snapshot.storage.k8s.io
      size: 8Gi

    # -- disable Helm creating TLS certificates if you want to let the operator
    # request certificates from cert-manager
    certManager: true

    # sstRetryCount: 3

    # If this is set will not create secrets from values and will instead try to use
    # a pre-existing secret of the same name.
    # clusterSecretName: cluster1-secrets
    readinessProbes:
      initialDelaySeconds: 15
      timeoutSeconds: 15
      periodSeconds: 30
      successThreshold: 1
      failureThreshold: 5

    livenessProbes:
      initialDelaySeconds: 50
      timeoutSeconds: 10
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 10

  haproxy:
    enabled: true
    size: 2
    readinessDelaySec: 15
    livenessDelaySec: 200
    # envVarsSecret: my-env-var-secrets
    resources:
      requests:
        memory: 1G
        cpu: 600m
      limits: {}
        # memory: 1G
        # cpu: 600m
    affinity:
      # -- set this to something else if you're deploying to more than one node
      antiAffinityTopologyKey: "none"
    gracePeriod: 30
    # only one of `maxUnavailable` or `minAvailable` can be set.
    podDisruptionBudget:
      maxUnavailable: 1
      # minAvailable: 0
    readinessProbes:
      initialDelaySeconds: 15
      timeoutSeconds: 1
      periodSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    livenessProbes:
      initialDelaySeconds: 60
      timeoutSeconds: 5
      periodSeconds: 30
      successThreshold: 1
      failureThreshold: 4

  proxysql:
    enabled: false

  logcollector:
    enabled: true
    resources:
      requests:
        memory: 100M
        cpu: 200m
      limits: {}

  users:
    - name: coturn
      dbs:
        # this is the Database for coturn itself
        - coturn
      grants:
        - ALTER
        - CREATE
        - DELETE
        - DROP
        - INDEX
        - INSERT
        - SELECT
        - UPDATE
        - REFERENCES
        - CREATE VIEW
      withGrantOption: true
      passwordSecretRef:
        name: "db-credentials"
        key: mysql-password

  pmm:
    enabled: false

  backup:
    # -- it's recommended to turn on backups, but they're off by default for CI purposes
    enabled: false
    pitr:
      enabled: false
      storageName: s3-binlogs
      timeBetweenUploads: 600
      timeoutSeconds: 60
      resources:
        requests: {}
        limits: {}

    storages:
      s3:
        type: s3
        verifyTLS: true
        resources:
          requests:
            memory: 1G
            cpu: 600m
        affinity:
          # -- set this to something else if deploying to more than one node
          antiAffinityTopologyKey: "none"
        labels:
          backupWorker: 'True'
        s3:
          bucket: coturn-db
          credentialsSecret: s3-db-credentials
          region: auto
          forcePathStyle: true
          prefix: /
          checksumAlgorithm: SHA256
          endpointUrl: ""


    # -- backups schedule. example:
    # - name: "daily-coturn-mysql-backup"
    #   schedule: ""
    #   retention:
    #     type: "count"
    #     count: 10
    #     # needs to be disabled when using pitr
    #     deleteFromStorage: true
    #   storageName: s3
    schedule: []

# most coturn config parameters that you really need
coturn:
  # --  hostname for the coturn server realm
  realm: "turn.example.com"

  # -- Extra environment variables to pass to the Coturn container
  extraEnvVars: []
  #  - name: STATIC_AUTH_SECRET_VAL_OPT
  #    value: supersecretpassword123abcyes

  auth:
    # -- username for the main user of the turn server
    username: "coturn"
    # -- password for the main user of the turn server
    password: ""
    # -- 'Static' authentication secret value (a string) for TURN REST API only.
    # If not set, then the turn server
    # will try to use the 'dynamic' value in the turn_secret table
    # in the user database (if present). The database-stored  value can be changed on-the-fly
    # by a separate program, so this is why that mode is considered 'dynamic'.
    staticAuthSecret: ""
    # -- existing secret with keys username/password for coturn
    existingSecret: ""
    secretKeys:
      # -- key in existing secret for turn server user
      username: username
      # -- key in existing secret for turn server user's password
      password: password
      # -- key in existing secret for coturn static-auth-secret
      staticAuthSecret: ""

  # -- coturn's listening IP address
  listeningIP: "0.0.0.0"

  ports:
    # -- minimum ephemeral port for coturn
    min: 49152
    # -- maximum ephemeral port for coturn
    max: 65535
    # -- insecure listening port
    listening: 3478
    # -- secure listening port
    tlsListening: 5349

  # -- set the logfile. Defaults to stdout for use with kubectl logs
  logFile: "stdout"

  # -- extra configuration for turnserver.conf
  extraTurnserverConfiguration: |
    verbose

  initContainer:
    image:
      # -- registry and repository for init container config generator image
      repository: mikefarah/yq
      # -- tag for init container config generator image
      tag: latest

# k8s pod security context:
# https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  # -- Enables Pod Security Context
  enabled: true
  # -- for all Containers in the Pod, all processes run as non-root
  runAsNonRoot: true
  # -- for all Containers in the Pod, all processes run w/ this userID
  runAsUser: 1000
  # -- for all Containers in the Pod, all processes run w/ this GroupID
  runAsGroup: 1000
  # -- all processes of the container are also part of the supplementary groupID
  fsGroup: 1000
  seccompProfile:
    # --  Filter a process's system calls
    type: "RuntimeDefault"

containerSecurityContext:
  # -- Enables Security Context
  enabled: true
  capabilities:
    # -- linux cabilities to allow for the coturn k8s pod
    add: ["NET_BIND_SERVICE"]
    # -- linux cabilities to disallow for the coturn k8s pod
    drop: ["ALL"]
  # -- allow modificatin to root filesystem
  readOnlyRootFilesystem: false
  # -- allow priviledged access
  allowPrivilegeEscalation: false
