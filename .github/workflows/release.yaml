---
name: Publish chart

# The upstream release pipeline lives in .forgejo/ and publishes to Harbor,
# Forgejo and Codeberg. That does not run on GitHub, so this fork publishes the
# chart to our own OCI registry instead, the same way kubeaid publishes its
# first-party charts: tagged with the chart's own Chart.yaml version, and a
# version already present in the registry is never republished.

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'charts/coturn/Chart.yaml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.21.3'

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" \
            | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Package and push
        env:
          REGISTRY: oci://ghcr.io/obmondo/charts
        run: |
          version="$(awk '/^version:/ {print $2; exit}' charts/coturn/Chart.yaml)"

          if [ -z "$version" ]; then
            echo "Could not read a version from charts/coturn/Chart.yaml"
            exit 1
          fi

          if helm show chart "${REGISTRY}/coturn" --version "$version" >/dev/null 2>&1; then
            echo "coturn ${version} is already published, skipping."
            exit 0
          fi

          # Chart.lock and charts/ are gitignored in this repository, so the
          # subcharts have to be resolved from Chart.yaml before packaging.
          helm dependency update charts/coturn

          helm package charts/coturn --destination dist
          helm push "dist/coturn-${version}.tgz" "$REGISTRY"
