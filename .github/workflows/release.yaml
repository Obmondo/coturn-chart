---
name: Publish chart

# Upstream's release pipeline lives in .forgejo/ and publishes to Harbor,
# Forgejo and Codeberg, none of which run on GitHub. This fork publishes to our
# own OCI registry when a version tag is pushed: the tag is the release
# decision, taken deliberately, not a side effect of merging a pull request.

"on":
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.21.3'

      - name: Resolve the version to publish
        id: version
        run: |
          version="$(awk '/^version:/ {print $2; exit}' charts/coturn/Chart.yaml)"

          if [ -z "$version" ]; then
            echo "Could not read a version from charts/coturn/Chart.yaml"
            exit 1
          fi

          # On a tag push the tag names the release, so it has to agree with the
          # chart it is releasing - otherwise the artifact and its tag disagree.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Chart.yaml version ${version}"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" \
            | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Package and push
        env:
          REGISTRY: oci://ghcr.io/obmondo/charts
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if helm show chart "${REGISTRY}/coturn" --version "$VERSION" >/dev/null 2>&1; then
            echo "coturn ${VERSION} is already published, skipping."
            exit 0
          fi

          # Chart.lock and charts/ are gitignored in this repository, so the
          # subcharts have to be resolved from Chart.yaml before packaging.
          helm dependency update charts/coturn

          helm package charts/coturn --destination dist
          helm push "dist/coturn-${VERSION}.tgz" "$REGISTRY"
