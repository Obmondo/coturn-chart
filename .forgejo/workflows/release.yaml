name: Release Chart

on:
  push:
    branches:
      - 'main'
    paths:
      - 'charts/coturn/Chart.yaml'

permissions:
  contents: read

jobs:
  harbor:
    uses: small-hack/reusable-workflows/.forgejo/workflows/publish-charts.yaml@main
    with:
      harbor_url: harbor.smallhack.org
      harbor_project: charts
      force: false
      chart_dir: charts
      chart: coturn
    secrets:
      harbor_user: ${{ secrets.HARBOR_USER }}
      harbor_token: ${{ secrets.HARBOR_TOKEN }}

  forgejo:
    uses: small-hack/reusable-workflows/.forgejo/workflows/publish-charts.yaml@main
    with:
      forgejo_url: https://git.smallhack.org
      owner: small-hack
      repo: coturn-chart
      force: false
      chart_dir: charts
      chart: coturn
      release: true
    secrets:
      forgejo_api_token: ${{ secrets.FORGE_TOKEN }}

  codeberg:
    uses: small-hack/reusable-workflows/.forgejo/workflows/publish-charts.yaml@main
    with:
      owner: open-engineering
      repo: coturn-chart
      force: false
      chart_dir: charts
      chart: coturn
      codeberg: true
      release: false
    secrets:
      codeberg_token: ${{ secrets.CODEBERG_TOKEN }}
